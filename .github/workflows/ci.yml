name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  extension-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun x playwright-core install --with-deps --no-shell chromium
      - run: bun run test:ui

  native-host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Test native host
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --manifest-path native-host/Cargo.toml
      - name: Build and self-test (--once)
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release --manifest-path native-host/Cargo.toml
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./native-host/target/release/tabcurb-host.exe --once
          else
            ./native-host/target/release/tabcurb-host --once
          fi
