name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-zip
          path: dist/tab-reaper-extension.zip

  build-host-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install musl and arm64 cross-linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - env:
          RUSTFLAGS: "-D warnings"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --manifest-path native-host/Cargo.toml
          cargo build --release --target aarch64-unknown-linux-musl --manifest-path native-host/Cargo.toml
          cp native-host/target/x86_64-unknown-linux-musl/release/tab-reaper-host tab-reaper-host-linux-x86_64
          cp native-host/target/aarch64-unknown-linux-musl/release/tab-reaper-host tab-reaper-host-linux-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-linux
          path: |
            tab-reaper-host-linux-x86_64
            tab-reaper-host-linux-arm64

  build-host-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release --target aarch64-apple-darwin --manifest-path native-host/Cargo.toml
          cargo build --release --target x86_64-apple-darwin --manifest-path native-host/Cargo.toml
          cp native-host/target/aarch64-apple-darwin/release/tab-reaper-host tab-reaper-host-darwin-arm64
          cp native-host/target/x86_64-apple-darwin/release/tab-reaper-host tab-reaper-host-darwin-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-macos
          path: |
            tab-reaper-host-darwin-arm64
            tab-reaper-host-darwin-x86_64

  build-host-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,i686-pc-windows-msvc
      - shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --manifest-path native-host/Cargo.toml
          cargo build --release --target aarch64-pc-windows-msvc --manifest-path native-host/Cargo.toml
          cargo build --release --target i686-pc-windows-msvc --manifest-path native-host/Cargo.toml
          cp native-host/target/x86_64-pc-windows-msvc/release/tab-reaper-host.exe tab-reaper-host-windows-x86_64.exe
          cp native-host/target/aarch64-pc-windows-msvc/release/tab-reaper-host.exe tab-reaper-host-windows-arm64.exe
          cp native-host/target/i686-pc-windows-msvc/release/tab-reaper-host.exe tab-reaper-host-windows-x86.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-windows
          path: |
            tab-reaper-host-windows-x86_64.exe
            tab-reaper-host-windows-arm64.exe
            tab-reaper-host-windows-x86.exe

  publish-release:
    needs: [build-extension, build-host-linux, build-host-macos, build-host-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tab Reaper ${GITHUB_REF_NAME}" \
            --generate-notes
