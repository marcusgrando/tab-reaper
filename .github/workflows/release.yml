name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/tab-reaper-extension.zip

  build-host-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release --manifest-path native-host/Cargo.toml
          cp native-host/target/release/tab-reaper-host tab-reaper-host-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: host-linux-x86_64
          path: tab-reaper-host-linux-x86_64

  build-host-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release --target aarch64-apple-darwin --manifest-path native-host/Cargo.toml
          cargo build --release --target x86_64-apple-darwin --manifest-path native-host/Cargo.toml
          cp native-host/target/aarch64-apple-darwin/release/tab-reaper-host tab-reaper-host-darwin-arm64
          cp native-host/target/x86_64-apple-darwin/release/tab-reaper-host tab-reaper-host-darwin-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: host-macos
          path: |
            tab-reaper-host-darwin-arm64
            tab-reaper-host-darwin-x86_64

  build-host-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release --manifest-path native-host/Cargo.toml
          cp native-host/target/release/tab-reaper-host.exe tab-reaper-host-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: host-windows-x86_64
          path: tab-reaper-host-windows-x86_64.exe

  publish-release:
    needs: [build-extension, build-host-linux, build-host-macos, build-host-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tab Reaper ${GITHUB_REF_NAME}" \
            --generate-notes
