<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabCurb</title>
    <link rel="icon" href="icons/icon48.png" type="image/png" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="masthead">
        <h1 class="brand"><img src="icons/icon48.png" alt="" />TabCurb</h1>
        <button id="btn-options" type="button">
          <svg class="icon" aria-hidden="true"><use href="ui.svg#settings"/></svg>Settings
        </button>
      </div>
      <div class="memory">
        <div class="memory-line">
          <span id="memory-source">Memory usage</span>
          <span id="memory-badge">Loading…</span>
        </div>
        <div class="bar-track" aria-hidden="true"><div id="memory-bar"></div></div>
        <div class="stats">
          <span><strong id="stat-loaded">–</strong> loaded</span>
          <span><strong id="stat-discarded">–</strong> sleeping</span>
        </div>
      </div>
    </header>

    <div id="update-banner" class="update-banner hidden" role="status">
      <span class="update-text">
        Update available: <a id="update-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      </span>
      <div class="update-actions">
        <button id="btn-copy-update" type="button" class="item-action">Copy update command</button>
        <button id="btn-dismiss-update" type="button" class="item-close" aria-label="Dismiss update notice" title="Dismiss update notice"></button>
      </div>
    </div>

    <div id="recovery-banner" class="recovery-banner hidden">
      <span id="recovery-text"></span>
      <button id="btn-restore-session" type="button" class="item-action">Restore</button>
    </div>

    <div class="search-wrap">
      <svg class="icon" aria-hidden="true"><use href="ui.svg#search"/></svg>
      <input id="search-input" type="text" role="combobox" aria-expanded="true" aria-controls="tab-list" aria-autocomplete="list" aria-label="Search open tabs" placeholder="Search open tabs" autocomplete="off" autofocus />
    </div>
    <main id="tab-list" class="tab-list" role="listbox" aria-label="Open tabs"></main>
    <div id="action-status" class="action-status hidden" role="status"></div>

    <footer>
      <span class="shortcuts"><kbd>Enter</kbd> to switch <kbd>Esc</kbd> to close</span>
      <button id="btn-discard" type="button"><svg class="icon" aria-hidden="true"><use href="ui.svg#moon"/></svg>Sleep idle tabs</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
