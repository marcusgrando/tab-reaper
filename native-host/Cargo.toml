[package]
name = "tab-reaper-host"
version = "0.7.0"
edition = "2021"
description = "Lightweight Chrome Native Messaging companion that reports exact Chrome process memory and syncs local backups to a user-chosen folder."

[dependencies]
cap-fs-ext = "4"
cap-std = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
